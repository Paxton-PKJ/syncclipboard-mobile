plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.jericx.syncclipboardmobile'
version = '1.0.0'

android {
  namespace "expo.modules.nativeutil"
  useLibrary 'android.test.runner'
  useLibrary 'android.test.base'
  useLibrary 'android.test.mock'
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
    testInstrumentationRunner "android.test.InstrumentationTestRunner"
    // 内置旧 runner 的无过滤发现会遍历所有 RN/Expo Dex；只运行本模块的测试类。
    testInstrumentationRunnerArguments class: 'expo.modules.nativeutil.HistoryDragPayloadTest'
  }
}

dependencies {
  implementation 'com.facebook.react:react-native:0.83.2'
  implementation 'androidx.core:core-ktx:1.13.1'
  implementation 'androidx.documentfile:documentfile:1.0.1'
}
