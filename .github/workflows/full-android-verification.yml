name: Audit the APKs produced for integration a70b7c8

on:
  push:
    branches: [verify/full-android-a70b7c8]

permissions:
  actions: read
  contents: read

jobs:
  verify-apks:
    name: Verify the four published APK artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 44889517424
          pattern: apk-*
          path: apks
      - name: Check signatures and the libraries for every configured ABI
        run: |
          python3 - <<'PY'
          from collections import defaultdict
          from hashlib import file_digest
          import os
          from pathlib import Path
          import subprocess
          from zipfile import ZipFile

          root = Path('apks')
          supported = {'arm64-v8a', 'armeabi-v7a', 'x86_64'}
          names = sorted(supported | {'universal'})
          assert {p.name for p in root.iterdir()} == {f'apk-{name}' for name in names}
          signers = sorted((Path(os.environ['ANDROID_HOME']) / 'build-tools').glob('*/apksigner'))
          assert signers, 'apksigner is missing from the Android SDK'
          signer = signers[-1]
          runtime = {'libappmodules.so', 'libreactnative.so', 'libhermesvm.so'}
          rows = ['| APK | ABIs with complete app runtime | Bytes | SHA-256 |', '| --- | --- | ---: | --- |']
          libraries = {}

          for name in names:
              apk = root / f'apk-{name}' / f'SyncClipboard-1.1.8-{name}.apk'
              assert list(apk.parent.glob('*.apk')) == [apk], apk
              by_abi = defaultdict(set)
              with ZipFile(apk) as archive:
                  assert archive.testzip() is None, f'{apk.name} failed its ZIP integrity check'
                  for path in archive.namelist():
                      if path.startswith('lib/') and path.endswith('.so'):
                          _, abi, library = path.split('/')
                          by_abi[abi].add(library)
              required = supported if name == 'universal' else {name}
              found = set(by_abi)
              assert required <= found, (apk.name, found, required)
              if name != 'universal':
                  assert found == required, (apk.name, found, required)
              for abi in required:
                  assert runtime <= by_abi[abi], (apk.name, abi, runtime - by_abi[abi])
              subprocess.run([str(signer), 'verify', '--verbose', str(apk)], check=True)
              libraries[name] = by_abi
              complete = {abi for abi in found if runtime <= by_abi[abi]}
              with apk.open('rb') as stream:
                  digest = file_digest(stream, 'sha256').hexdigest()
              rows.append(f'| {apk.name} | {", ".join(sorted(complete))} | {apk.stat().st_size} | `{digest}` |')

          universal = libraries['universal']
          for abi in sorted(supported):
              assert libraries[abi][abi] <= universal[abi], (abi, libraries[abi][abi] - universal[abi])
          for abi in sorted(universal.keys() - supported):
              missing = runtime - universal[abi]
              note = f'Extra ABI in universal APK: {abi}. Libraries: {", ".join(sorted(universal[abi]))}.'
              if missing:
                  note += f' Missing app runtime libraries: {", ".join(sorted(missing))}.'
              rows.extend(('', note))

          report = '\n'.join(rows) + '\n'
          print(report)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(report)
          PY
