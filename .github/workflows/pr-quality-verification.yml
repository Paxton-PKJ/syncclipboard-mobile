name: Verify feature PR readiness
on:
  push:
    branches: [verify/pr-quality-f150a3f]
permissions:
  contents: read
jobs:
  javascript:
    name: ${{ matrix.target }} / JavaScript
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: drag-out, sha: 4533248d33ed6fc94456de2dad32aae15eb81f0e}
          - {target: incoming, sha: cb10ebe34c26f777c7c0d689c889cea56fdf6f78}
          - {target: integration, sha: f150a3fd03fa666a9d66f19b9b7ad00ec5db0489}
    steps:
      - uses: actions/checkout@v6
        with: {ref: '${{ matrix.sha }}'}
      - uses: actions/setup-node@v6
        with: {node-version: 20, cache: npm}
      - run: npm ci
      - run: npm run lint && npm run format-docs:check && npm run type-check
      - run: npm run test:coverage -- --runInBand --silent
  android:
    name: ${{ matrix.target }} / Android release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: drag-out, sha: 4533248d33ed6fc94456de2dad32aae15eb81f0e}
          - {target: incoming, sha: cb10ebe34c26f777c7c0d689c889cea56fdf6f78}
          - {target: integration, sha: f150a3fd03fa666a9d66f19b9b7ad00ec5db0489}
    steps:
      - uses: actions/checkout@v6
        with: {ref: '${{ matrix.sha }}'}
      - uses: actions/setup-node@v6
        with: {node-version: 20, cache: npm}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci && npx expo prebuild --platform android --no-install
      - name: Run repository Android release unit tests
        working-directory: android
        run: bash gradlew -I ../.github/gradle/local-unit-tests.gradle testLocalReleaseUnitTest --console=plain
      - name: Assemble all release APKs
        working-directory: android
        run: bash gradlew :app:assembleRelease --console=plain
      - name: Check release outputs
        working-directory: android/app/build/outputs/apk/release
        run: for abi in arm64-v8a armeabi-v7a x86_64 universal; do test -s "app-$abi-release.apk" || exit 1; done
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}-emulator-release
          path: android/app/build/outputs/apk/release/app-x86_64-release.apk
          if-no-files-found: error
      - name: Build device tests for the integrated app
        if: matrix.target == 'integration'
        working-directory: android
        run: bash gradlew :native-util:assembleDebugAndroidTest -PreactNativeArchitectures=x86_64 --console=plain
      - uses: actions/upload-artifact@v7
        if: matrix.target == 'integration'
        with:
          name: integration-instrumentation
          path: modules/native-util/android/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
