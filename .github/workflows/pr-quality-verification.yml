name: Verify feature PR readiness
on:
  push:
    branches: [verify/pr-quality-6fb9b1f]
permissions:
  contents: read
jobs:
  javascript:
    name: ${{ matrix.target }} / JavaScript
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: drag-out, sha: 58fcd5961edc1cd143c269d5d5dfd9a517be6b20}
          - {target: incoming, sha: 9af643eaecbbc43a36fd9e6bae675730e942bc45}
          - {target: integration, sha: 6fb9b1fb4897620dcc19bbc0ab7cc565441c07bb}
    steps:
      - uses: actions/checkout@v6
        with: {ref: '${{ matrix.sha }}', fetch-depth: 2}
      - uses: actions/setup-node@v6
        with: {node-version: 20, cache: npm}
      - run: npm ci
      - name: Verify that the added regression tests fail before the fixes
        if: matrix.target != 'integration'
        run: |
          if [[ '${{ matrix.target }}' == 'incoming' ]]; then
            files=(App.tsx src/components/DropReceiveOverlay.tsx src/components/QuickLoadingPage.tsx src/screens/DirectShareReceiveScreen.tsx src/services/sync/incomingContentUpload.ts)
            suites=(UiInitialization IncomingReceiveRetry)
          else
            files=(src/services/sync/ClipboardChangedHandler.ts src/services/history/HistoryTransferQueue.ts)
            suites=(ClipboardChangedHandler HistoryTransferQueue.progress)
          fi
          git restore --source=HEAD^ -- "${files[@]}"
          if npm test -- --runInBand --silent --no-coverage --json --outputFile="$RUNNER_TEMP/regressions.json" "${suites[@]}"; then exit 1; fi
          node -e "const r=require(process.argv[1]); const failed=r.testResults.flatMap(s=>s.assertionResults.filter(t=>t.status==='failed').map(t=>t.title)); console.log(failed); if(r.numRuntimeErrorTestSuites || failed.length < 3) process.exit(1);" "$RUNNER_TEMP/regressions.json"
          git restore -- "${files[@]}"
      - run: npm run lint && npm run format-docs:check && npm run type-check
      - run: npm run test:coverage -- --runInBand --silent
  android:
    name: ${{ matrix.target }} / Android release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: drag-out, sha: 58fcd5961edc1cd143c269d5d5dfd9a517be6b20}
          - {target: incoming, sha: 9af643eaecbbc43a36fd9e6bae675730e942bc45}
          - {target: integration, sha: 6fb9b1fb4897620dcc19bbc0ab7cc565441c07bb}
    steps:
      - uses: actions/checkout@v6
        with: {ref: '${{ matrix.sha }}'}
      - uses: actions/setup-node@v6
        with: {node-version: 20, cache: npm}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci && npx expo prebuild --platform android --no-install
      - name: Run repository Android release unit tests
        working-directory: android
        run: bash gradlew -I ../.github/gradle/local-unit-tests.gradle testLocalReleaseUnitTest --console=plain
      - name: Assemble all release APKs
        working-directory: android
        run: bash gradlew :app:assembleRelease --console=plain
      - name: Check release outputs
        working-directory: android/app/build/outputs/apk/release
        run: for abi in arm64-v8a armeabi-v7a x86_64 universal; do test -s "app-$abi-release.apk" || exit 1; done
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}-emulator-release
          path: android/app/build/outputs/apk/release/app-x86_64-release.apk
          if-no-files-found: error
      - name: Build device tests for the integrated app
        if: matrix.target == 'integration'
        working-directory: android
        run: bash gradlew :native-util:assembleDebugAndroidTest -PreactNativeArchitectures=x86_64 --console=plain
      - uses: actions/upload-artifact@v7
        if: matrix.target == 'integration'
        with:
          name: integration-instrumentation
          path: modules/native-util/android/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
