name: Verify drag and share integration

on:
  push:
    branches: [verify/drag-and-share-1716fca]

permissions:
  contents: read

jobs:
  code-style:
    uses: ./.github/workflows/code-style.yml

  unit-tests:
    uses: ./.github/workflows/test.yml

  original-android-compile:
    name: Compile the original merge commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 1716fcaa1dd5c0021bb8c78b35a53fe443dde356
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - run: bash ./gradlew :native-util:compileReleaseKotlin --console=plain
        working-directory: android

  emulator-build:
    uses: ./.github/workflows/android-build.yml

  instrumentation-apk:
    name: Package Android instrumentation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - run: bash ./gradlew :native-util:assembleDebugAndroidTest -PreactNativeArchitectures=x86_64 --console=plain
        working-directory: android
      - uses: actions/upload-artifact@v7
        with:
          name: native-util-instrumentation-apk
          path: modules/native-util/android/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
