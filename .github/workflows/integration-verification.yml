name: Verify drag and share fixes

on:
  push:
    branches: [verify/drag-and-share-a70b7c8]

permissions:
  contents: read

jobs:
  code-style:
    uses: ./.github/workflows/code-style.yml

  unit-tests:
    uses: ./.github/workflows/test.yml

  emulator-apk:
    name: Kotlin tests and x86_64 release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Select the emulator ABI in the generated project
        run: |
          sed -i 's/include "arm64-v8a", "armeabi-v7a", "x86_64"/include "x86_64"/; s/universalApk true/universalApk false/' android/app/build.gradle
          grep -F 'include "x86_64"' android/app/build.gradle
      - name: Run Kotlin unit tests
        run: bash ./gradlew -I ../.github/gradle/local-unit-tests.gradle testLocalReleaseUnitTest -PreactNativeArchitectures=x86_64 --console=plain
        working-directory: android
      - name: Build the test APK
        run: bash ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --console=plain
        working-directory: android
      - uses: actions/upload-artifact@v7
        with:
          name: apk-x86_64
          path: android/app/build/outputs/apk/release/app-x86_64-release.apk
          if-no-files-found: error
